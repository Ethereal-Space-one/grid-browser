name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  electron-m0:
    name: Electron M0 build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/electron-m0/package-lock.json
      - name: Install M0 dependencies
        working-directory: prototypes/electron-m0
        run: npm ci
      - name: Build and check M0 contracts
        working-directory: prototypes/electron-m0
        run: npm test
      - name: Check request lifecycle in Electron
        if: runner.os == 'macOS'
        working-directory: prototypes/electron-m0
        run: npm run test:e2e:requests
      - name: Check session credentials without keychain access
        if: runner.os == 'macOS'
        working-directory: prototypes/electron-m0
        run: npm run test:e2e:key-storage
      - name: Check tab and window isolation in Electron
        if: runner.os == 'macOS'
        working-directory: prototypes/electron-m0
        run: npm run test:e2e:tabs
      - name: Check branch state and cache retention in Electron
        if: runner.os == 'macOS'
        working-directory: prototypes/electron-m0
        run: npm run test:e2e:path-state
      - name: Check native visit recovery without repeating submissions
        if: runner.os == 'macOS'
        working-directory: prototypes/electron-m0
        run: npm run test:e2e:navigation
      - name: Check clickable path map and native layout
        if: runner.os == 'macOS'
        working-directory: prototypes/electron-m0
        run: npm run test:e2e:path-map
      - name: Check source-bound summary and independent page questions
        if: runner.os == 'macOS'
        working-directory: prototypes/electron-m0
        run: npm run test:e2e:understanding
      - name: Check committed tasks across independent processes
        if: runner.os == 'macOS'
        working-directory: prototypes/electron-m0
        run: npm run test:e2e:storage
      - name: Check personal judgments and immutable runtime versions
        if: runner.os == 'macOS'
        working-directory: prototypes/electron-m0
        run: npm run test:e2e:judgment
      - name: Check explicit two-source comparison
        if: runner.os == 'macOS'
        working-directory: prototypes/electron-m0
        run: npm run test:e2e:comparison

  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test Swift core and build browser probe
        run: swift test
      - name: Check prototype JavaScript
        run: node --check prototypes/search-lab/app.js
      - name: Check shell scripts
        run: |
          bash -n scripts/build-chromium-g1.sh scripts/smoke-chromium-g1.sh
          sh -n scripts/package-probe.sh
