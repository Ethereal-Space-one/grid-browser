<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Grid · 探索地图</title><link rel="stylesheet" href="map.css"></head><body><section id="dock" aria-label="探索地图"><header><button id="chain" type="button" aria-expanded="false" aria-controls="chains"><span id="chain-name">这次探索</span><span aria-hidden="true">⌄</span></button><span id="count"></span><button id="locate" type="button">当前</button><button id="orientation" type="button">纵向</button><button id="toggle" type="button" aria-expanded="false" aria-controls="graph">展开</button></header><nav id="chains" aria-label="切换探索标签" hidden></nav><div id="map-content" hidden><nav id="graph" aria-label="访问节点与分支"></nav><form id="continue-form" hidden><label for="continue-input" id="continue-label">从这里继续</label><div><input id="continue-input" autocomplete="off" maxlength="8192" placeholder="继续问一个问题，或打开网址"><button id="continue-submit" type="submit">继续 ↗</button><button id="continue-cancel" type="button" aria-label="取消继续">×</button></div></form><footer><span id="map-note">点击节点回到那一步</span><button id="undo" type="button" hidden>撤销移除</button></footer></div><p id="map-error" role="alert" hidden></p></section><script src="map.js"></script></body></html>
